<!DOCTYPE html>
<html data-loading lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FAF7F2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Làm chủ mọi thứ">
    <link rel="icon" type="image/png" href="../assets/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="../manifest.json">
    <title>Danh sách</title>
    <!-- Preconnect & DNS-Prefetch for Fast Loading on Mobile Networks -->
    <link rel="dns-prefetch" href="https://ghdydszifdaiphcjguri.supabase.co">
    <link rel="preconnect" href="https://ghdydszifdaiphcjguri.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">
    
    <!-- Google Fonts: Nunito & Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/shell.css">
    <link rel="stylesheet" href="../css/support-pages-modern.css?v=20261125_07">
<style>html[data-loading] body{visibility:hidden}</style>
</head><body data-feature="danh-sach"><div class="app-container">    <div class="modal-overlay support-page-modal list-page-modal" id="list-modal" aria-hidden="true">
        <div class="modal-sheet support-page-sheet list-page-sheet" role="dialog" aria-modal="true" aria-label="Danh sách">
            <template data-header class="ckkn-page-header support-page-header list-page-header">
                <div class="support-header-left list-header-left">
                    <div class="list-page-title">
                        <div class="list-title-wrap">
                            <h2>Danh sách</h2>
                            <span class="list-count-badge" id="list-count-pill" title="Số lượng chủ đề">
                                <i data-lucide="layers" class="list-count-icon"></i>
                                <strong id="list-topic-count">0</strong>
                                <span>chủ đề</span>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="support-header-actions list-header-actions" aria-label="Thao tác Danh sách">
                    <button type="button" class="support-action-btn list-action-btn list-edit-btn" id="btn-edit-list-entry" aria-label="Chọn mục để chỉnh sửa" title="Chế độ sửa">
                        <i data-lucide="pencil"></i>
                    </button>
                    <button type="button" class="support-action-btn list-action-btn list-delete-btn" id="btn-delete-list-entry" aria-label="Chọn mục để xóa" title="Chế độ xóa">
                        <i data-lucide="trash-2"></i>
                    </button>
                    <button type="button" class="support-action-btn list-action-btn list-add-btn" id="btn-add-list-entry" aria-label="Thêm mục danh sách" title="Thêm mới">
                        <i data-lucide="plus"></i>
                        <span class="list-add-btn-text">Thêm mới</span>
                    </button>
                    <button type="button" class="header-close-btn list-exit-btn" id="btn-close-list-modal" onclick="goBackToHome()" title="Thoát về Trang chủ" aria-label="Thoát">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </template>
            <p class="support-storage-notice" id="list-storage-notice" role="status" aria-live="polite" hidden></p>
            <div class="list-topics-list" id="list-topics-list" aria-live="polite"></div>
        </div>
    </div><!-- End #list-modal -->

    <!-- FORM THÊM / SỬA DANH SÁCH -->
    <div class="modal-overlay support-entry-form-overlay list-entry-form-overlay" id="list-entry-modal" aria-hidden="true">
        <div class="support-entry-form-sheet list-entry-sheet" role="dialog" aria-modal="true" aria-labelledby="list-entry-form-title">
            <div class="support-modal-header list-modal-header">
                <div class="support-modal-title-wrap">
                    <span class="support-modal-eyebrow list-modal-eyebrow">DANH SÁCH CỦA BẠN</span>
                    <h2 id="list-entry-form-title">Thêm mục</h2>
                    <p id="list-entry-form-description">Chọn chủ đề hoặc tạo chủ đề mới.</p>
                </div>
                <button class="modal-close-btn" id="btn-close-list-entry-modal" aria-label="Đóng form Danh sách" title="Đóng">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <form id="list-entry-form" class="support-entry-form">
                <div class="support-form-field list-form-field list-topic-choice-field">
                    <label id="list-entry-topic-label" for="list-entry-topic-select"><span class="support-field-icon list-field-icon"><i data-lucide="folder"></i></span>Chủ đề</label>
                    <div class="list-topic-choice-row">
                        <select id="list-entry-topic-select" required></select>
                        <button type="button" class="list-create-topic-btn" id="btn-create-list-topic" aria-label="Tạo chủ đề mới" title="Tạo chủ đề mới">
                            <i data-lucide="plus"></i>
                        </button>
                    </div>
                    <div class="list-inline-new-topic" id="list-new-topic-field" hidden>
                        <label for="list-entry-new-topic">Tên chủ đề mới</label>
                        <input type="text" id="list-entry-new-topic" maxlength="120" placeholder="Ví dụ: Anime">
                    </div>
                </div>
                <div class="support-form-field list-form-field list-item-field" id="list-item-field">
                    <label for="list-entry-item"><span class="support-field-icon list-field-icon"><i data-lucide="list"></i></span>Mục con</label>
                    <input type="text" id="list-entry-item" maxlength="180" placeholder="Ví dụ: One Piece" required>
                </div>
                <p class="support-entry-form-error" id="list-entry-form-error" role="alert" hidden></p>
                <div class="support-entry-form-actions">
                    <button type="button" class="support-cancel-btn" id="btn-cancel-list-entry">Hủy</button>
                    <button type="submit" class="support-save-btn list-save-btn"><i data-lucide="check"></i><span>Lưu</span></button>
                </div>
            </form>
        </div>
    </div><!-- End #list-entry-modal -->
</div>    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script type="module" src="../js/boot.js?v=20261124_05"></script>
</body></html>
