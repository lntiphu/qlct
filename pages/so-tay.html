            <!-- Header chuẩn Florenté Luxury -->
            <template data-header class="ckkn-page-header support-page-header handbook-page-header">
                <div class="support-header-left handbook-header-left">
                    <div class="handbook-page-title">
                        <h2>Sổ tay sức khỏe</h2>
                    </div>
                </div>
                <div class="support-header-actions handbook-header-actions" aria-label="Thao tác Sổ tay sức khỏe">
                    <button type="button" class="handbook-star-filter-btn" id="btn-toggle-handbook-fav" aria-label="Lọc bài viết đã ghim sao" title="Chỉ hiện bài yêu thích">

                        <span class="handbook-add-btn-text">Thêm bài</span>
                    </button>
                    <button type="button" class="header-close-btn handbook-exit-btn" id="btn-close-handbook-modal" onclick="goBackToHome()" title="Thoát về Trang chủ" aria-label="Thoát">

                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </template>

                        <button type="button" class="handbook-search-clear-btn" id="btn-clear-handbook-search" aria-label="Xóa tìm kiếm" title="Xóa tìm kiếm" hidden>

                <div class="support-header-left handbook-header-left">

                        <h2>Chi tiết bài viết</h2>
                    </div>
                </div>
                <div class="support-header-actions handbook-header-actions handbook-detail-header-actions" aria-label="Thao tác bài viết">

                    </button>
                    <button type="button" class="handbook-detail-btn handbook-edit-btn" id="btn-edit-handbook-detail" aria-label="Chỉnh sửa bài viết" title="Chỉnh sửa bài viết">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                    </button>
                    <button type="button" class="handbook-detail-btn handbook-delete-btn" id="btn-delete-handbook-detail" aria-label="Xóa bài viết" title="Xóa bài viết">

    <!-- TRANG THÊM / SỬA BÀI TRONG SỔ TAY (FULL PAGE VIEW) -->

                <div class="support-header-left handbook-entry-header-left">
                    <h2 id="handbook-entry-form-title">Thêm bài mới</h2>
                </div>
                <div class="support-header-actions handbook-header-actions">
                    <button type="button" class="header-close-btn handbook-exit-btn" id="btn-close-handbook-entry" aria-label="Đóng và quay lại Sổ tay sức khỏe" title="Đóng">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <form id="handbook-entry-form" class="handbook-entry-form">
                <input type="hidden" id="handbook-entry-id" value="">
                <div class="handbook-form-grid">
                    <div class="handbook-form-field handbook-field-wide">
                        <label for="handbook-entry-title"><i data-lucide="bookmark"></i>Tên bài <span>*</span></label>
                        <input id="handbook-entry-title" type="text" maxlength="180" required placeholder="Ví dụ: Nước gừng ấm giảm ho">
                    </div>
                    <div class="handbook-form-field handbook-field-wide">
                        <div class="handbook-cat-header-row">
                            <label for="handbook-entry-category"><i data-lucide="tag"></i>Danh mục <span>*</span></label>
                            <button type="button" class="handbook-add-cat-btn" id="btn-toggle-custom-cat" title="Thêm danh mục mới">+ Danh mục mới</button>
                        </div>
                        <select id="handbook-entry-category" required>
                            <option value="Ho/cảm cúm">Ho/cảm cúm</option>
                            <option value="Tiêu hóa">Tiêu hóa</option>
                            <option value="Da liễu">Da liễu</option>
                            <option value="Xương khớp">Xương khớp</option>
                            <option value="Mẹo vặt gia đình">Mẹo vặt gia đình</option>
                            <option value="Khác">Khác</option>
                            <option value="__custom__">➕ Thêm danh mục mới...</option>
                        </select>
                        <div class="handbook-custom-cat-box" id="handbook-custom-cat-box" hidden>
                            <input type="text" id="handbook-entry-custom-category" maxlength="80" placeholder="Nhập tên danh mục tùy ý của bạn...">
                            <button type="button" class="handbook-confirm-cat-btn" id="btn-confirm-custom-cat">Thêm</button>
                        </div>
                    </div>
                    <div class="handbook-form-field">
                        <label for="handbook-entry-use"><i data-lucide="sparkles"></i>Công dụng</label>
                        <textarea id="handbook-entry-use" rows="3" maxlength="1200" placeholder="Bài này dùng để làm gì?"></textarea>
                    </div>
                    <div class="handbook-form-field">
                        <label for="handbook-entry-ingredients"><i data-lucide="leaf"></i>Nguyên liệu</label>
                        <textarea id="handbook-entry-ingredients" rows="3" maxlength="1200" placeholder="Ví dụ: gừng tươi, mật ong..."></textarea>
                    </div>
                    <div class="handbook-form-field handbook-field-wide">
                        <label for="handbook-entry-method"><i data-lucide="list-ordered"></i>Cách làm / cách dùng</label>
                        <textarea id="handbook-entry-method" rows="4" maxlength="3000" placeholder="Viết từng bước, liều lượng hoặc cách sử dụng..."></textarea>
                    </div>
                    <div class="handbook-form-field">
                        <label for="handbook-entry-warning"><i data-lucide="triangle-alert"></i>Lưu ý / chống chỉ định</label>
                        <textarea id="handbook-entry-warning" rows="3" maxlength="1600" placeholder="Ai không nên dùng? Khi nào cần dừng?"></textarea>
                    </div>
                    <div class="handbook-form-field">
                        <label for="handbook-entry-source"><i data-lucide="link"></i>Nguồn</label>
                        <input id="handbook-entry-source" type="text" maxlength="300" placeholder="Sách, người thân, website...">
                    </div>
                    <div class="handbook-form-field handbook-field-wide">
                        <label for="handbook-entry-personal"><i data-lucide="heart"></i>Ghi chú cá nhân</label>
                        <textarea id="handbook-entry-personal" rows="3" maxlength="1600" placeholder="Kinh nghiệm hoặc điều cần nhớ của riêng bạn..."></textarea>
                    </div>
                </div>
                <p class="handbook-form-error" id="handbook-form-error" role="alert" hidden></p>
                <div class="support-form-actions handbook-entry-actions">
                    <button type="button" class="support-cancel-btn" id="btn-cancel-handbook-entry">Hủy</button>
                    <button type="submit" class="support-save-btn handbook-save-btn"><i data-lucide="check"></i><span id="handbook-save-text">Lưu bài</span></button>
                </div>
            </form>
        </div>
    </div>
