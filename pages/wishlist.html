<!DOCTYPE html>
<html data-loading lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FAF7F2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Làm chủ mọi thứ">
    <link rel="icon" type="image/png" href="../assets/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="../manifest.json">
    <title>Wishlist</title>
    <!-- Preconnect & DNS-Prefetch for Fast Loading on Mobile Networks -->
    <link rel="dns-prefetch" href="https://ghdydszifdaiphcjguri.supabase.co">
    <link rel="preconnect" href="https://ghdydszifdaiphcjguri.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">
    
    <!-- Google Fonts: Nunito & Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/shell.css">
    <link rel="stylesheet" href="../css/support-pages-modern.css?v=20261125_06">
<style>html[data-loading] body{visibility:hidden}</style>
</head><body data-feature="wishlist"><div class="app-container">    <div class="modal-overlay support-page-modal wishlist-page-modal" id="wishlist-modal" aria-hidden="true">
        <div class="modal-sheet support-page-sheet wishlist-page-sheet" role="dialog" aria-modal="true" aria-label="Wishlist">
            <template data-header class="ckkn-page-header support-page-header wishlist-page-header">
                <div class="support-header-left wishlist-header-left">
                    <div class="wishlist-page-title">
                        <h2>Wishlist</h2>
                    </div>
                </div>
                <div class="support-header-actions wishlist-header-actions" aria-label="Thao tác Wishlist">
                    <button type="button" class="support-action-btn wishlist-action-btn wishlist-delete-btn" id="btn-delete-wishlist-entry" aria-label="Chọn Wishlist để xóa" title="Chế độ xóa">
                        <i data-lucide="trash-2"></i>
                    </button>
                    <button type="button" class="support-action-btn wishlist-action-btn wishlist-add-btn" id="btn-add-wishlist-entry" aria-label="Thêm Wishlist" title="Thêm mới">
                        <i data-lucide="plus"></i>
                        <span class="wishlist-add-btn-text">Thêm mới</span>
                    </button>
                    <button type="button" class="header-close-btn wishlist-exit-btn" id="btn-close-wishlist-modal" onclick="goBackToHome()" title="Thoát về Trang chủ" aria-label="Thoát">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </template>
            <p class="support-storage-notice" id="wishlist-storage-notice" role="status" aria-live="polite" hidden></p>

            <!-- THANH CHUYỂN TAB: WISHLIST / ĐÃ MUA -->
            <div class="wishlist-filter-row">
                <div class="wishlist-filter-tabs" role="tablist" aria-label="Phân loại Wishlist">
                    <button type="button" class="wishlist-filter-tab active" id="btn-wishlist-tab-pending" data-wishlist-tab="pending" role="tab" aria-selected="true">
                        <i data-lucide="heart"></i>
                        <span>Wishlist</span>
                        <span class="wishlist-tab-badge" id="wishlist-tab-badge-pending">0</span>
                    </button>
                    <button type="button" class="wishlist-filter-tab" id="btn-wishlist-tab-bought" data-wishlist-tab="bought" role="tab" aria-selected="false">
                        <i data-lucide="check-circle-2"></i>
                        <span>Đã mua</span>
                        <span class="wishlist-tab-badge" id="wishlist-tab-badge-bought">0</span>
                    </button>
                </div>
            </div>

            <div class="support-table-card wishlist-table-card">
                <table class="support-table wishlist-table" aria-label="Danh sách Wishlist">
                    <thead>
                        <tr>
                            <th class="wishlist-col-rank" id="wishlist-th-rank">TOP</th>
                            <th class="wishlist-col-content">NỘI DUNG WISHLIST</th>
                            <th class="wishlist-col-action" id="wishlist-th-action" title="Thao tác">THAO TÁC</th>
                        </tr>
                    </thead>
                    <tbody id="wishlist-table-body" aria-live="polite"></tbody>
                </table>
            </div>
        </div>
    </div><!-- End #wishlist-modal -->

    <!-- FORM THÊM / SỬA WISHLIST -->
    <div class="modal-overlay support-entry-form-overlay wishlist-entry-form-overlay" id="wishlist-entry-modal" aria-hidden="true">
        <div class="support-entry-form-sheet wishlist-entry-sheet" role="dialog" aria-modal="true" aria-labelledby="wishlist-entry-form-title">
            <div class="support-modal-header wishlist-modal-header">
                <div class="support-modal-title-wrap">
                    <h2 id="wishlist-entry-form-title">Thêm Wishlist</h2>
                </div>
                <button class="modal-close-btn" id="btn-close-wishlist-entry-modal" aria-label="Đóng form Wishlist" title="Đóng">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <form id="wishlist-entry-form" class="support-entry-form">
                <div class="support-form-field wishlist-form-field">
                    <input type="text" id="wishlist-entry-title" maxlength="160" placeholder="Ví dụ: Mua máy ảnh mới, Đi Đà Lạt..." required autocomplete="off">
                </div>
                <p class="support-entry-form-error" id="wishlist-entry-form-error" role="alert" hidden></p>
                <div class="support-entry-form-actions">
                    <button type="button" class="support-cancel-btn" id="btn-cancel-wishlist-entry">Hủy</button>
                    <button type="submit" class="support-save-btn wishlist-save-btn">
                        <i data-lucide="check"></i>
                        <span>Lưu</span>
                    </button>
                </div>
            </form>
        </div>
    </div><!-- End #wishlist-entry-modal -->
</div>    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script type="module" src="../js/boot.js?v=20261124_05"></script>
</body></html>
