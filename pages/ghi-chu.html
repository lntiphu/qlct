<!DOCTYPE html>
<html data-loading lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FAF7F2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Ghi Chú</title>
    <!-- Google Fonts: Nunito & Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/ghi-chu.css">
    <link rel="stylesheet" href="../css/ghi-chu-modern.css?v=20261125_06">
    
<style>html[data-loading] body{visibility:hidden}</style>
</head>
<body data-feature="ghi-chu">
    <div class="notes-container">
        <!-- Top Header Bar -->
        <template data-header class="notes-header-bar">
            <div class="notes-header-left">
                <div class="notes-header-title-wrap">
                    <h1 class="notes-header-heading">Ghi chú</h1>
                </div>
            </div>
            <div class="notes-header-actions">
                <button type="button" class="notes-header-add-btn" id="btn-header-add-note" title="Thêm ghi chú mới" aria-label="Thêm mới">
                    <i data-lucide="plus"></i>
                    <span class="notes-btn-text">Thêm ghi chú</span>
                </button>
                <button type="button" class="header-close-btn notes-exit-btn" id="btn-exit-ghichu" onclick="goBackToHome()" title="Thoát về Trang chủ" aria-label="Thoát">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </template>

        <!-- Controls & Search -->
        <div class="notes-search-section">
            <div class="notes-search-box">
                <i data-lucide="search" class="notes-search-icon"></i>
                <input type="text" id="notes-search-input" placeholder="Tìm kiếm ghi chú theo tên, nội dung..." autocomplete="off">
                <button type="button" class="notes-search-clear-btn" id="notes-clear-search-btn" title="Xóa tìm kiếm" aria-label="Xóa">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="notes-stats-row">
                <span class="notes-counter-badge" id="notes-counter-badge">0 ghi chú</span>
            </div>
        </div>

        <!-- Danh sách thẻ ghi chú -->
        <div class="notes-cards-container" id="notes-cards-container">
            <!-- Dynamic Note Cards -->
        </div>
    </div>

    <!-- POPUP MODAL THÊM / CHỈNH SỬA GHI CHÚ -->
    <div class="notes-modal-overlay" id="notes-modal-overlay">
        <div class="notes-modal-sheet" id="notes-modal-sheet">
            <div class="notes-drag-handle"></div>
            <div class="notes-modal-header">
                <div class="notes-modal-heading-wrap">
                    <span class="notes-modal-kicker">GHI CHÚ</span>
                    <h3 id="notes-form-heading">Ghi chú mới</h3>
                </div>
                <div class="notes-modal-header-actions">
                    <button type="button" class="notes-modal-close-btn" id="btn-close-note-modal" title="Đóng" aria-label="Đóng">
                        <i data-lucide="x"></i>
                    </button>
                </div>
            </div>

            <form id="notes-form" class="notes-form">
                <input type="hidden" id="note-id" value="">
                <div class="notes-keep-editor">
                    <input type="text" id="note-title-input" placeholder="Tiêu đề" required autocomplete="off" aria-label="Tiêu đề ghi chú">
                    <textarea id="note-content-input" placeholder="Ghi chú..." rows="7" aria-label="Nội dung ghi chú"></textarea>
                </div>

                <div class="notes-form-actions">
                    <span class="notes-char-count" id="notes-char-count">0 ký tự</span>
                    <button type="button" class="notes-modal-cancel" id="btn-cancel-note-form">Hủy</button>
                    <button type="submit" class="notes-modal-save" id="btn-save-note"><span id="btn-save-note-text">Lưu</span></button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
<script type="module" src="../js/boot.js?v=20261124_05"></script>
</body>
</html>
